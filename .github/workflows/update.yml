name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
# 给默认 GITHUB_TOKEN 写权限（若回退到它时生效）；实际跨仓库推送使用下面的 GH_TOKEN。
permissions:
  contents: write
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # 用自己的 PAT（Fine-grained，拥有 zkkm2580/iptv-playlist 与 zkkm2580/api 的 contents:write）
          token: ${{ secrets.GH_TOKEN }}
      - name: setup git
        run: |
          git config user.name "iptv-bot[bot]"
          git config user.email "84861620+iptv-bot[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
      - name: install dependencies
        run: npm install
      - name: update internal playlists
        run: npm run playlist:update --silent >> $GITHUB_OUTPUT
        id: playlist-update
      - name: lint internal playlists
        run: npm run playlist:lint
      - name: validate internal playlists
        # 自托管镜像：源数据可能含上游屏蔽名单频道，仅作提示，不阻断发布。
        run: npm run playlist:validate
        continue-on-error: true
      - name: generate public playlists
        run: npm run playlist:generate
      - name: generate .api/streams.json
        run: npm run api:generate
      - name: update readme.md
        run: npm run readme:update
      - run: git status
      - name: commit changes to /streams
        run: |
          git add streams
          git status
          git commit --allow-empty -m "[Bot] Update /streams" -m "Committed by [iptv-bot](https://github.com/apps/iptv-bot) via [update](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow." -m "${{ steps.playlist-update.outputs.OUTPUT }}" --no-verify
      - name: commit changes to readme.md
        run: |
          git add README.md
          git status
          git commit --allow-empty -m "[Bot] Update README.md" -m "Committed by [iptv-bot](https://github.com/apps/iptv-bot) via [update](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow." --no-verify
      - name: push all changes to the repository
        if: ${{ !env.ACT && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        run: git push
      - name: deploy public playlists to github pages
        uses: JamesIves/github-pages-deploy-action@4.1.1
        if: ${{ !env.ACT && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        with:
          repository-name: zkkm2580/iptv-playlist
          branch: gh-pages
          folder: .gh-pages
          token: ${{ secrets.GH_TOKEN }}
          git-config-name: iptv-bot[bot]
          git-config-email: 84861620+iptv-bot[bot]@users.noreply.github.com
          commit-message: '[Bot] Deploy to GitHub Pages'
          clean: true
      - name: move .api/streams.json to zkkm2580/api
        uses: JamesIves/github-pages-deploy-action@4.1.1
        if: ${{ !env.ACT && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        with:
          repository-name: zkkm2580/api
          branch: gh-pages
          folder: .api
          token: ${{ secrets.GH_TOKEN }}
          git-config-name: iptv-bot[bot]
          git-config-email: 84861620+iptv-bot[bot]@users.noreply.github.com
          commit-message: '[Bot] Deploy to zkkm2580/api'
          clean: false
